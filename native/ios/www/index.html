<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Main Street Steakhouse</title>
  <style>
    /* The only page that ships inside the app: what shows with no signal.
       Everything else is steakhouse.football, live. */
    html, body { margin: 0; height: 100%; background: #191614; color: #f3ead9; }
    body {
      display: grid; place-items: center; text-align: center;
      font: 17px/1.5 -apple-system, "Inter", system-ui, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    main { max-width: 26em; padding: 0 1.5em; }
    svg { width: 64px; height: 64px; display: block; margin: 0 auto 1.25em; }
    .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #C99C3F; margin: 0 0 .75em; }
    h1 { font: 500 30px/1.15 Georgia, "Fraunces", serif; margin: 0 0 .5em; }
    p { margin: 0 0 1.5em; color: #c9bfae; }
    button {
      font: inherit; color: #191614; background: #C99C3F; border: 0; border-radius: 999px;
      padding: .7em 1.6em; letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" fill="none" role="img" aria-label="Main Street Steakhouse">
      <circle cx="32" cy="32" r="28.5" stroke="#C99C3F" stroke-width="3"/>
      <ellipse cx="32" cy="21" rx="8.5" ry="2.6" stroke="#f3ead9" stroke-width="2.4"/>
      <path d="M32 22.5V45" stroke="#f3ead9" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="32" cy="45.5" rx="13" ry="3.4" stroke="#f3ead9" stroke-width="2.4"/>
    </svg>
    <p class="eyebrow">Main Street Steakhouse</p>
    <h1>The kitchen&rsquo;s closed.</h1>
    <p>The league is live, and the phone isn&rsquo;t. Find a signal and try again.</p>
    <button onclick="location.replace('https://steakhouse.football/')">Try again</button>
  </main>
</body>
</html>
