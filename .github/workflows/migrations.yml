name: migrations

# The repo is connected to Supabase, so a migration file whose version is not
# in the remote history gets applied to production on merge. This runs before
# that can happen.
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/applied_versions.txt"
      - "supabase/pending_migrations.txt"
      - "scripts/check-migrations.mjs"
      - "scripts/replay-migrations.sh"
      - "scripts/replay/**"
      - "supabase/tests/**"
      - ".github/workflows/migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/applied_versions.txt"
      - "supabase/pending_migrations.txt"

jobs:
  filenames:
    name: filenames match recorded versions
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      # Without this the check can only compare the migrations directory against
      # a ledger committed beside it — two files in the same pull request, which
      # a single consistent mistake satisfies. Reading the real history is what
      # makes the ledger evidence instead of an assertion.
      #
      # psql ships on the runner. coalesce guards a null name: it would
      # otherwise collapse the whole row to NULL, print a blank line, and drop
      # that version from the comparison silently.
      #
      # The third field is the migration's own statements, so the check can
      # compare each FILE against what actually ran. base64 because the SQL is
      # full of newlines and quotes and this has to survive as one line;
      # `translate` strips the wrapping newlines encode() adds every 76 chars.
      # A migration with no recorded statements yields an empty third field,
      # which the parser reads as "nothing to compare".
      - name: read the recorded migration history
        if: env.SUPABASE_DB_URL != ''
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --no-psqlrc -Atc \
            "select version || ' ' || coalesce(name, '(unnamed)') || ' ' ||
                    coalesce(translate(encode(convert_to(
                      array_to_string(statements, ';' || chr(10)), 'UTF8'), 'base64'),
                      chr(10) || chr(13), ''), '')
               from supabase_migrations.schema_migrations order by version" \
            > "$RUNNER_TEMP/remote.txt"
          echo "rows: $(wc -l < "$RUNNER_TEMP/remote.txt")"
          echo "REMOTE_ARGS=--remote $RUNNER_TEMP/remote.txt" >> "$GITHUB_ENV"

      # No setup-node and no install, on purpose. The check is Node stdlib only,
      # so the runner's own Node runs it and the offline floor cannot be broken
      # by a lockfile, a registry outage, or an expired credential. REMOTE_ARGS
      # is empty when no database URL is configured, and the check says so in
      # its output rather than implying more than it verified.
      - run: node scripts/check-migrations.mjs ${REMOTE_ARGS:-}

  # ---------------------------------------------------------------------------
  # The filenames job proves each file is a faithful copy of a statement that
  # ran. It cannot prove the directory BUILDS — a set of migrations can each be
  # correct and still not replay, because the order they were applied in by hand
  # is not the order their filenames sort in. That is what put the `main`
  # preview branch in MIGRATIONS_FAILED, and it stayed invisible because the
  # only thing that replays the directory is Supabase, on a branch, after merge.
  #
  # This runs the same replay here, on the runner's own Postgres, before merge.
  # It found two failures the first time it was run: a `create or replace` that
  # cannot change a function's OUT parameters, and a seed whose foreign key
  # points at a league no migration creates.
  # ---------------------------------------------------------------------------
  replay:
    name: the directory builds an empty database
    runs-on: ubuntu-latest
    env:
      # Production's major (Supabase `postgres_engine`). Change it when the
      # project is upgraded, not when the runner image is.
      REPLAY_PG_MAJOR: "17"
      REPLAY_PG_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      # The replay must run on production's Postgres major (17), not whatever
      # the runner image happens to ship. ubuntu-latest moved to 26.04 and its
      # preinstalled Postgres went from 16 to 18; 18 refuses UPDATEs on
      # `challenges` (replica identity full over a stored generated column in
      # a publication) that 17 allows, and the job went red on a refusal
      # production cannot produce. Only the server binaries are wanted — the
      # harness builds its own throwaway cluster.
      - name: install the postgres server binaries production runs
        run: |
          set -euo pipefail
          if [ ! -x "/usr/lib/postgresql/$REPLAY_PG_MAJOR/bin/initdb" ]; then
            sudo apt-get update -qq
            if ! sudo apt-get install -y --no-install-recommends "postgresql-$REPLAY_PG_MAJOR"; then
              # Not in the image's sources: add the PGDG repository, which
              # postgresql-common ships a setup script for.
              sudo apt-get install -y --no-install-recommends postgresql-common
              sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
              sudo apt-get install -y --no-install-recommends "postgresql-$REPLAY_PG_MAJOR"
            fi
          fi
          "/usr/lib/postgresql/$REPLAY_PG_MAJOR/bin/postgres" --version

      # sudo because the harness installs its `http` and `pg_cron` stand-ins
      # into the Postgres extension directory, which is how the first migration
      # gets to run verbatim instead of being edited before it is tested.
      # --test runs supabase/tests/*.sql against the replayed database. A
      # behavioural test belongs here rather than beside the app: this is the
      # schema the migrations actually build, and the only place a claim about
      # what the database refuses can be checked without a live project.
      - name: replay all migrations against an empty database, then test it
        run: sudo --preserve-env=REPLAY_RUNDIR,REPLAY_PG_MAJOR,REPLAY_PG_STRICT bash scripts/replay-migrations.sh --summary --test
