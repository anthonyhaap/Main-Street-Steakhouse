name: migrations

# The repo is connected to Supabase, so a migration file whose version is not
# in the remote history gets applied to production on merge. This runs before
# that can happen.
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/applied_versions.txt"
      - "scripts/check-migrations.mjs"
      - ".github/workflows/migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/applied_versions.txt"

jobs:
  filenames:
    name: filenames match recorded versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup-node and no install, on purpose. The check is Node stdlib
      # only, so the runner's own Node runs it and this gate cannot be broken
      # by a lockfile, a registry outage, or an expired credential.
      - run: node scripts/check-migrations.mjs
