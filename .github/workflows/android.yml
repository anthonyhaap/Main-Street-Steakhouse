name: android

# Builds the Play Store bundle for native/android. The project is a Trusted
# Web Activity with no Java of its own, so "does it build" is nearly the whole
# question, and this answers it on every change to the project — and on demand,
# which is how a bundle for the Play Console is produced.
#
# Signed when the four ANDROID_* secrets are set; unsigned otherwise, which
# still proves the build and is still something the Play Console will refuse.
on:
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "native/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: release bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore travels as one base64 line in a secret and is written to a
      # file outside the checkout so nothing can commit it by accident.
      - name: unpack the upload key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Play refuses a versionCode it has seen; the run number only goes up.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: steakhouse-android
          path: |
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
